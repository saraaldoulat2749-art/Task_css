<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css6.css">

</head>
<body>
    <h3>position : static</h3>
    <div class="container">
        <div class="box red">One</div>
        <div class="box green static ">Two</div>
        <div class="box red">Three</div>
        <div class="box red L" >Four</div>
    </div>    

     <h3>position : relative</h3>
    <div class="container">
        <div class="box red">One</div>
        <div class="box green relative  " >Two</div>
        <div class="box red">Three</div>
        <div class="box red L">Four</div>
    </div>    
    
    
     <h3>position : absolute</h3>
    <div class="container">
        <div class="box red">One</div>
        <div class="box green absolute  ">Two</div>
        <div class="box red">Three</div>
        <div class="box red L">Four</div>
    </div>    
</body>
</html>
